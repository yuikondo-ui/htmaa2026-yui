<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>·</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Geist:wght@100..900&display=swap" rel="stylesheet">
<style>
  @font-face { font-family:"ABC Diatype Variable"; src:url(../fonts/ABCDiatypeVariable.woff2) format("woff2"); font-weight:100 900; font-display:swap; }
  :root { --bg:#131313; --green:#58cd86; --dim:#3a3a3a; }
  * { box-sizing:border-box; margin:0; padding:0; }
  html, body { height:100%; }
  body {
    background:var(--bg); color:var(--green);
    font-family:"ABC Diatype Variable","Geist","Inter Tight",Helvetica,Arial,sans-serif;
    font-weight:545; font-variation-settings:"wght" 545;
    font-size:clamp(16px, 1.15vw + 9px, 21px); line-height:1.15; letter-spacing:-0.004em;
    display:grid; place-items:center; overflow:hidden;
  }
  form { display:grid; gap:14px; justify-items:center; width:min(80vw, 460px); }
  h1 {
    font-family:"Anton","Archivo Expanded",Impact,sans-serif; font-weight:400;
    font-size:clamp(40px, 9vw, 104px); line-height:.92; text-align:center;
    text-transform:lowercase; letter-spacing:-0.01em; color:var(--green);
    transform:scaleX(.82); transform-origin:center;
  }
  input {
    width:100%; margin-top:22px; padding:10px 0; background:none; border:0;
    border-bottom:1px solid var(--green); color:var(--green); outline:none;
    font:inherit; text-align:center; letter-spacing:.15em; caret-color:var(--green);
  }
  input::placeholder { color:var(--dim); letter-spacing:.3em; }
  body.no form { animation:shake .35s; }
  @keyframes shake { 20%{transform:translateX(-6px)} 40%{transform:translateX(6px)} 60%{transform:translateX(-4px)} 80%{transform:translateX(4px)} }
</style>
</head>
<body>
  <form id="form" autocomplete="off">
    <h1>how to break into (almost) anywhere</h1>
    <input id="pw" type="password" placeholder="·······" autocapitalize="off" spellcheck="false" autofocus>
  </form>

<script>
/* ---- sha256 of the password (change with setpass.py) ---- */
var KEY  = "f3c1f895fdb1ac14c19166f4d606f9c8be3805ec2d4596dbf344d75a8c41e3a6";

var form = document.getElementById('form'), pw = document.getElementById('pw');
setTimeout(function(){ pw.focus(); }, 50);

form.addEventListener('submit', async function(e){
  e.preventDefault();
  var v = pw.value.trim().toLowerCase(); if (!v) return;
  var h = await sha256(v);
  if (h === KEY) {
    var folder = (await sha256('door:' + v)).slice(0,16);
    location.href = folder + '/';
  } else {
    pw.value = ''; document.body.classList.remove('no'); void document.body.offsetWidth; document.body.classList.add('no');
  }
});

/* sha256 (pure js fallback, so it also works from file://) */
async function sha256(s){
  if (window.crypto && crypto.subtle) {
    try { var b = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(s));
          return Array.from(new Uint8Array(b)).map(function(x){return x.toString(16).padStart(2,'0');}).join(''); } catch(_){}
  }
  return sha256js(s);
}
function sha256js(ascii){
  function rr(v,a){return (v>>>a)|(v<<(32-a));}
  var mathPow=Math.pow,maxWord=mathPow(2,32),i,j,result='',words=[],asciiBitLength=ascii.length*8,
      hash=sha256js.h=sha256js.h||[],k=sha256js.k=sha256js.k||[],primeCounter=k.length,isComposite={};
  for(var candidate=2;primeCounter<64;candidate++){ if(!isComposite[candidate]){ for(i=0;i<313;i+=candidate)isComposite[i]=candidate;
      hash[primeCounter]=(mathPow(candidate,.5)*maxWord)|0; k[primeCounter++]=(mathPow(candidate,1/3)*maxWord)|0; } }
  ascii=unescape(encodeURIComponent(ascii)); ascii+='\x80'; while(ascii.length%64-56)ascii+='\x00';
  for(i=0;i<ascii.length;i++){ j=ascii.charCodeAt(i); if(j>>8)return; words[i>>2]|=j<<((3-i)%4)*8; }
  words[words.length]=((asciiBitLength/maxWord)|0); words[words.length]=(asciiBitLength);
  for(j=0;j<words.length;){ var w=words.slice(j,j+=16),oldHash=hash; hash=hash.slice(0,8);
    for(i=0;i<64;i++){ var w15=w[i-15],w2=w[i-2],a=hash[0],e=hash[4],
        temp1=hash[7]+(rr(e,6)^rr(e,11)^rr(e,25))+((e&hash[5])^((~e)&hash[6]))+k[i]+(w[i]=(i<16)?w[i]:(w[i-16]+(rr(w15,7)^rr(w15,18)^(w15>>>3))+w[i-7]+(rr(w2,17)^rr(w2,19)^(w2>>>10)))|0),
        temp2=(rr(a,2)^rr(a,13)^rr(a,22))+((a&hash[1])^(a&hash[2])^(hash[1]&hash[2]));
      hash=[(temp1+temp2)|0].concat(hash); hash[4]=(hash[4]+temp1)|0; }
    for(i=0;i<8;i++)hash[i]=(hash[i]+oldHash[i])|0; }
  for(i=0;i<8;i++)for(j=3;j+1;j--){ var b=(hash[i]>>(j*8))&255; result+=((b<16)?0:'')+b.toString(16); }
  return result;
}
</script>
</body>
</html>
